name: Packager
permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "**"
    paths-ignore:
      - ".github/**"
      - ".libraries/**"
      - ".gitmodules"
      - ".editorconfig"
      - ".gitignore"
      - ".pkgmeta"
      - ".wowluarc.json"
      - "mise.toml"
      - "*.md"

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    concurrency:
      group: packager

    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
